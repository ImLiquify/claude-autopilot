<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150">
<style>.t1{fill:#26241f}.t2{fill:#7b776d}@media (prefers-color-scheme: dark){.t1{fill:#efede7}.t2{fill:#a29e94}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g transform="translate(10 40)" shape-rendering="crispEdges">
<rect x="20" y="70" width="50" height="10" fill="#8a867c"/><rect x="20" y="60" width="10" height="10" fill="#8a867c"/><rect x="10" y="50" width="10" height="10" fill="#8a867c"/><rect x="0" y="40" width="10" height="10" fill="#8a867c"/>
<rect x="80" y="60" width="10" height="20" fill="#d97757"/><rect x="100" y="60" width="10" height="20" fill="#d97757"/><rect x="130" y="60" width="10" height="20" fill="#d97757"/><rect x="150" y="60" width="10" height="20" fill="#d97757"/>
<rect x="80" y="0" width="80" height="60" fill="#d97757"/><rect x="160" y="20" width="20" height="20" fill="#d97757"/><rect x="60" y="20" width="20" height="20" fill="#d97757"/>
<rect class="eye" x="90" y="20" width="10" height="15" fill="#1f1e1b"/><rect class="eye" x="120" y="20" width="10" height="15" fill="#1f1e1b"/>
</g>
<text class="t1" x="210" y="88" font-size="54" font-weight="800" font-family="Segoe UI, system-ui, -apple-system, sans-serif">Autopilot</text>
<text class="t2" x="213" y="116" font-size="18" font-family="Segoe UI, system-ui, -apple-system, sans-serif">for Claude Code</text>
</svg>
