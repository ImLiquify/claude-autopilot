<svg xmlns="http://www.w3.org/2000/svg" width="730" height="72" viewBox="0 0 730 72"><style>
.card{fill:#fbfaf7;stroke:#e6e1d6}.t1{fill:#26241f}.t2{fill:#6f6b62}.trkf{fill:#ebe6dc}.div{stroke:#e6e1d6}
@media (prefers-color-scheme: dark){.card{fill:#262522;stroke:#38362f}.t1{fill:#efede7}.t2{fill:#a8a49a}.trkf{fill:#3a3833}.div{stroke:#38362f}}
.num{font-variant-numeric:tabular-nums}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.bob{animation:bob 1.2s ease-in-out infinite}.tap{animation:tap .3s steps(1) infinite}
.d1,.d2,.d3{animation:dot 1.2s infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes tap{50%{transform:translateY(4px)}}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="card" x="0.5" y="0.5" width="729" height="71" rx="14"/>
<g transform="translate(12 24)" shape-rendering="crispEdges"><rect x="8" y="28" width="20" height="4" fill="#8a867c"/><rect x="8" y="24" width="4" height="4" fill="#8a867c"/><rect x="4" y="20" width="4" height="4" fill="#8a867c"/><rect x="0" y="16" width="4" height="4" fill="#8a867c"/><rect x="32" y="24" width="4" height="8" fill="#d97757"/><rect x="40" y="24" width="4" height="8" fill="#d97757"/><rect x="52" y="24" width="4" height="8" fill="#d97757"/><rect x="60" y="24" width="4" height="8" fill="#d97757"/>
<g transform="translate(0 4)"><g class=""><rect x="32" y="0" width="32" height="24" fill="#d97757"/><rect x="64" y="8" width="8" height="8" fill="#d97757"/><rect class="eye" x="36" y="8" width="4" height="6" fill="#1f1e1b"/><rect class="eye" x="48" y="8" width="4" height="6" fill="#1f1e1b"/><g class="tap"><rect x="24" y="16" width="8" height="4" fill="#d97757"/></g></g></g></g>
<text class="t1" x="96" y="32" font-size="15" font-weight="600" letter-spacing="-0.15" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">Sonnet · medium</text>
<text class="t2" x="96" y="50" font-size="12" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">normal task</text>
<line class="div" x1="318" y1="14" x2="318" y2="58" stroke-width="1"/>
<text class="t2" x="334" y="24" font-size="12" font-weight="500" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">5-hour session</text>
<rect class="trkf" x="432" y="16" width="100" height="6" rx="3"/><rect x="432" y="16" width="42.0" height="6" rx="3" fill="#d97757"/>
<text class="t1 num" x="574" y="24" text-anchor="end" font-size="12.5" font-weight="600" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">42%</text>
<text class="t2 num" x="586" y="24" font-size="11.5" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">resets in 3h 12m</text>
<text class="t2" x="334" y="42" font-size="12" font-weight="500" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">Week</text>
<rect class="trkf" x="432" y="34" width="100" height="6" rx="3"/><rect x="432" y="34" width="31.0" height="6" rx="3" fill="#d97757"/>
<text class="t1 num" x="574" y="42" text-anchor="end" font-size="12.5" font-weight="600" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">31%</text>
<text class="t2 num" x="586" y="42" font-size="11.5" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">resets in 5d 17h</text>
<text class="t2 num" x="334" y="60" font-size="11.5" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">Lifetime 10.2B tokens</text>
</svg>