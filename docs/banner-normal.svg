<svg xmlns="http://www.w3.org/2000/svg" width="730" height="72" viewBox="0 0 730 72"><style>
.card{fill:#fbfaf7;stroke:#e8e4da}.t1{fill:#26241f}.t2{fill:#7b776d}.trkf{fill:#ece8df}.div{stroke:#ebe7de}.lockbg{fill:#f3efe6}
@media (prefers-color-scheme: dark){.card{fill:#262522;stroke:#3a3833}.t1{fill:#efede7}.t2{fill:#a29e94}.trkf{fill:#3a3833}.div{stroke:#3a3833}.lockbg{fill:#34322d}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.bob{animation:bob 1.2s ease-in-out infinite}.tap{animation:tap .3s steps(1) infinite}
.d1,.d2,.d3{animation:dot 1.2s infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes tap{50%{transform:translateY(4px)}}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="card" x="0.5" y="0.5" width="729" height="71" rx="16"/>
<g transform="translate(12 24)" shape-rendering="crispEdges"><rect x="8" y="28" width="20" height="4" fill="#8a867c"/><rect x="8" y="24" width="4" height="4" fill="#8a867c"/><rect x="4" y="20" width="4" height="4" fill="#8a867c"/><rect x="0" y="16" width="4" height="4" fill="#8a867c"/><rect x="32" y="24" width="4" height="8" fill="#d97757"/><rect x="40" y="24" width="4" height="8" fill="#d97757"/><rect x="52" y="24" width="4" height="8" fill="#d97757"/><rect x="60" y="24" width="4" height="8" fill="#d97757"/>
<g transform="translate(0 0)"><g class="bob"><rect x="32" y="0" width="32" height="24" fill="#d97757"/><rect x="64" y="8" width="8" height="8" fill="#d97757"/><rect class="eye" x="36" y="8" width="4" height="6" fill="#1f1e1b"/><rect class="eye" x="48" y="8" width="4" height="6" fill="#1f1e1b"/><rect x="24" y="8" width="8" height="8" fill="#d97757"/></g></g><rect class="d1" x="54" y="-10" width="4" height="4" fill="#d97757"/><rect class="d2" x="60" y="-10" width="4" height="4" fill="#d97757"/><rect class="d3" x="66" y="-10" width="4" height="4" fill="#d97757"/></g>
<text class="t1" x="96" y="32" font-size="14.5" font-weight="700" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">Sonnet · medium</text>
<text class="t2" x="96" y="49" font-size="11.5" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">normal task</text>
<line class="div" x1="318" y1="12" x2="318" y2="60" stroke-width="1"/>
<text class="t1" x="334" y="22" font-size="12.5" font-weight="600" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">5-hour session</text>
<rect class="trkf" x="438" y="14" width="92" height="9" rx="4.5"/><rect x="438" y="14" width="38.6" height="9" rx="4.5" fill="#d97757"/>
<text class="t1" x="540" y="22.5" font-size="12" font-weight="700" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">42%</text>
<text class="t2" x="578" y="22.5" font-size="11" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">resets in 2h 14m</text>
<text class="t1" x="334" y="42" font-size="12.5" font-weight="600" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">Week</text>
<rect class="trkf" x="438" y="34" width="92" height="9" rx="4.5"/><rect x="438" y="34" width="28.5" height="9" rx="4.5" fill="#d97757"/>
<text class="t1" x="540" y="42.5" font-size="12" font-weight="700" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">31%</text>
<text class="t2" x="578" y="42.5" font-size="11" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">resets in 3d 20h</text>
<text class="t2" x="334" y="62" font-size="11" font-family="Segoe UI Variable, Segoe UI, system-ui, -apple-system, sans-serif">Lifetime 1.2B tokens</text>
</svg>